image boot.vfat {
	vfat {
		files = {
			"bcm2712d0-rpi-5-b.dtb",
			"bcm2712-rpi-500.dtb",
			"bcm2712-rpi-5-b.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf",
			"Image",

		}
	}

	size = 256M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
